<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Cuti - Ahmad Dedi Ariansyah</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #f1f5f9; 
            color: #334155; 
            margin: 0; 
            padding: 40px 20px; 
        }
        .container { max-width: 850px; margin: 0 auto; }
        
        .header { 
            background-color: #1e293b; 
            color: #ffffff; 
            padding: 28px; 
            border-radius: 12px 12px 0 0; 
            border-bottom: 4px solid #0ea5e9; 
        }
        .header h1 { 
            margin: 0; 
            font-size: 22px; 
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .header-info { 
            margin-top: 12px; 
            font-size: 13.5px; 
            color: #cbd5e1; 
            line-height: 1.6;
        }
        .header-info strong { color: #ffffff; }

        .card { 
            background: #ffffff; 
            border-radius: 0 0 12px 12px; 
            padding: 28px; 
            border: 1px solid #e2e8f0; 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02); 
        }

        .summary-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 16px; 
            margin-bottom: 28px; 
        }
        .stat-box { 
            background: #f8fafc; 
            border: 1px solid #e2e8f0; 
            border-radius: 8px; 
            padding: 16px 12px; 
            text-align: center; 
        }
        .stat-box .number { 
            font-size: 26px; 
            font-weight: 700; 
            color: #0ea5e9; 
        }
        .stat-box .label { 
            font-size: 11px; 
            color: #64748b; 
            font-weight: 600;
            margin-top: 4px;
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }

        table { width: 100%; border-collapse: collapse; margin-top: 8px; }
        th { 
            background-color: #f1f5f9; 
            color: #475569; 
            text-align: left; 
            padding: 12px; 
            font-size: 13px; 
            font-weight: 600;
            border-bottom: 2px solid #cbd5e1; 
        }
        td { 
            padding: 14px 12px; 
            border-bottom: 1px solid #f1f5f9; 
            font-size: 14px; 
        }
        
        .text-center { text-align: center; }
        .badge { 
            background-color: #e0f2fe; 
            color: #0369a1; 
            padding: 5px 12px; 
            border-radius: 16px; 
            font-size: 12px; 
            font-weight: 600; 
            display: inline-block;
        }
        
        #loading { text-align: center; padding: 30px; color: #64748b; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>LAPORAN REKAPITULASI CUTI KARYAWAN</h1>
        <div class="header-info">
            Nama: <strong>Ahmad Dedi Ariansyah</strong> | Unit: <strong>REGIONAL SOLUTION & OPERATION II</strong><br>
            Periode: <strong>Kontrak 2026 (Live Data)</strong>
        </div>
    </div>

    <div class="card">
        <div id="loading">Memuat data terbaru dari Google Sheets...</div>
        
        <div id="content" style="display: none;">
            <div class="summary-grid">
                <div class="stat-box">
                    <div class="number" id="stat-awal">12</div>
                    <div class="label">Jatah Cuti Awal</div>
                </div>
                <div class="stat-box">
                    <div class="number" id="stat-diambil">0</div>
                    <div class="label">Cuti Diambil</div>
                </div>
                <div class="stat-box">
                    <div class="number" id="stat-sisa">12</div>
                    <div class="label">Sisa Cuti</div>
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th class="text-center" style="width: 10%;">No</th>
                        <th>Tanggal</th>
                        <th>Jenis Cuti</th>
                        <th class="text-center">Jumlah</th>
                        <th class="text-center">Sisa</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSGf1Cdj94vgGL4oUaXQ23ti-oSwbZXLUqX3fKBDGba6ZDDytiB8qayIdO6GBLAWdWogYY6ytg2PfBC/pub?gid=681195845&single=true&output=csv';

    fetch(csvUrl)
        .then(response => {
            if (!response.ok) throw new Error('Gagal mengambil CSV');
            return response.text();
        })
        .then(csvText => {
            const lines = csvText.split('\n');
            const tableBody = document.getElementById('table-body');
            tableBody.innerHTML = '';

            let isKontrak2026 = false;
            let totalDiambil = 0;
            let sisaTerakhir = 12;
            let no = 1;

            lines.forEach(line => {
                const cols = line.split(',').map(col => col.trim().replace(/^"|"$/g, ''));
                const rowText = line.toUpperCase();

                if (rowText.includes('KONTRAK 2026')) {
                    isKontrak2026 = true;
                    return;
                }

                if (isKontrak2026 && cols.length >= 4) {
                    const tgl = cols[1] || '';
                    const jenis = cols[2] || '';
                    const jumlah = parseInt(cols[3], 10);
                    const sisa = parseInt(cols[4], 10);

                    if (tgl && jenis && !isNaN(jumlah) && jenis !== 'CUTI' && jenis !== 'JATAH CUTI') {
                        totalDiambil += jumlah;
                        if (!isNaN(sisa)) sisaTerakhir = sisa;

                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td class="text-center">${no++}</td>
                            <td>${tgl}</td>
                            <td><span class="badge">${jenis}</span></td>
                            <td class="text-center">${jumlah} hari</td>
                            <td class="text-center">${!isNaN(sisa) ? sisa : '-'} hari</td>
                        `;
                        tableBody.appendChild(tr);
                    }
                }
            });

            document.getElementById('stat-diambil').innerText = totalDiambil;
            document.getElementById('stat-sisa').innerText = sisaTerakhir;
            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';
        })
        .catch(err => {
            document.getElementById('loading').innerText = 'Gagal memuat data dari Google Sheets.';
            console.error(err);
        });
</script>

</body>
</html>
